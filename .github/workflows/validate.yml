name: Validate Shadowrocket modules
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
concurrency:
  group: shadowrocket-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe modules and report experimental warnings
        run: python3 scripts/validate.py
      - name: Check allowlisted upstream references
        run: python3 scripts/check_upstreams.py --offline
      - name: Check upstream rule availability and syntax
        run: python3 scripts/check_upstreams.py
